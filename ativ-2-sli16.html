<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Layout Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #000000;
            padding: 20px;
        }

        .container-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
            min-height: 400px;
            gap: 10px;
        }

        .area {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
        }

        .topo { 
            grid-area: header; 
            background-color: #e19fbf; 
        }

        .lateral { 
            grid-area: sidebar; 
            background-color: #d743d2; 
        }

        .principal { 
            grid-area: main; 
            background-color: #8f0d6e; 
        }

        .rodape { 
            grid-area: footer; 
            background-color: #51075f; 
        }
    </style>
</head>
<body>

    <div class="container-layout">
        <div class="area topo">HEADER</div>
        <div class="area lateral">SIDEBAR</div>
        <div class="area principal">MAIN</div>
        <div class="area rodape">FOOTER</div>
    </div>

</body>
