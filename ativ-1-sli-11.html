<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        .caixa {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            border-radius: 8px;
        }

        .emoji-1 { background-color: #ffe495; }
        .emoji-2 { background-color: #ffe495; }
        .emoji-3 { background-color: #ffe495; }
        .emoji-4 { background-color: #ffe495; }
        .emoji-5 { background-color: #ffe495; }
        .emoji-6 { background-color: #ffe495; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="caixa emoji-1">❤️</div>
        <div class="caixa emoji-2">😍</div>
        <div class="caixa emoji-3">😁</div>
        <div class="caixa emoji-4">👍</div>
        <div class="caixa emoji-5">😂</div>
        <div class="caixa emoji-6">💕</div>
        </div>  

</body>
</html>
